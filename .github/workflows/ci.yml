name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proofs:
    name: Lean proofs and axioms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            lean/.lake
          key: lean-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ hashFiles('lean/**/*.lean') }}
          restore-keys: lean-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-
      - name: Build, check axioms, run worker
        run: scripts/check_proofs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: guard-worker-linux-x64
          path: lean/.lake/build/bin/guard-worker
          if-no-files-found: error

  python:
    name: Python lint, types, tests
    runs-on: ubuntu-latest
    needs: proofs
    env:
      # Fail (don't skip) the tests that need the Lean worker.
      AGENTGUARD_REQUIRE_WORKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: guard-worker-linux-x64
          path: src/bin
      - run: chmod +x src/bin/guard-worker
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy -p agentguard
      - run: uv run mypy tests
      - name: Tests, including 10,000 Lean-vs-reference cases
        run: uv run pytest
      - name: Wheel installs and runs outside the repo
        run: |
          uv build
          uv venv /tmp/wheel-venv
          uv pip install --python /tmp/wheel-venv/bin/python dist/*.whl
          cd /tmp && /tmp/wheel-venv/bin/agentguard version
