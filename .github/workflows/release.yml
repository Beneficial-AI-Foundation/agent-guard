name: Release

# Build the guard-worker decision binary for each supported platform and attach
# it to the GitHub Release. Triggered by pushing a version tag (e.g. `v0.1.0`),
# or manually. guard-worker is the pure-Lean worker the Python gateway talks to
# (JSON lines in, verdicts out); it has no C FFI, so it builds on Linux and
# macOS, the platforms AgentGuard supports.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-14          # Apple silicon
            target: macos-arm64
          - os: macos-13          # Intel
            target: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build guard-worker
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: "guard-worker"
          use-github-cache: true
          lake-package-directory: lean

      - name: Package
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME:-dev}"
          name="guard-worker-${ver}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp lean/.lake/build/bin/guard-worker "dist/${name}/"
          cp README.md LICENSE "dist/${name}/" 2>/dev/null || true
          tar -C dist -czf "${name}.tar.gz" "${name}"
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            guard-worker-*.tar.gz
            guard-worker-*.tar.gz.sha256

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/guard-worker-*.tar.gz
            dist/guard-worker-*.tar.gz.sha256
          generate_release_notes: true
