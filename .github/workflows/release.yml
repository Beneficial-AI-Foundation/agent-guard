name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  worker:
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, plat: manylinux_2_28_x86_64 }
          - { os: ubuntu-24.04-arm, plat: manylinux_2_28_aarch64 }
          - { os: macos-14, plat: macosx_11_0_arm64 }
          - { os: macos-13, plat: macosx_10_15_x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: scripts/check_proofs.sh
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: scripts/build_wheels.sh ${{ matrix.plat }}
      - uses: actions/upload-artifact@v4
        with: { name: "wheel-${{ matrix.plat }}", path: dist/*.whl }

  publish:
    needs: worker
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # Sigstore signing and PyPI trusted publishing
      contents: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "wheel-*", path: dist, merge-multiple: true }
      - run: cd dist && sha256sum *.whl > SHA256SUMS
      - uses: sigstore/gh-action-sigstore-python@v3.0.0
        with: { inputs: ./dist/*.whl }
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: "dist/*.whl" }
      - uses: softprops/action-gh-release@v2
        with: { files: "dist/*" }

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          provenance: true
          sbom: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
