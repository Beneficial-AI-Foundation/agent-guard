name: Live (real GitHub)

# Manual, nightly, and before a release. Needs a signed-in profile in secrets.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    environment: live
    env:
      AGENTGUARD_LIVE: "1"
      AGENTGUARD_LIVE_OWNER: ${{ vars.AGENTGUARD_LIVE_OWNER }}
      AGENTGUARD_LIVE_TOKEN: ${{ secrets.AGENTGUARD_LIVE_TOKEN }}
      AGENTGUARD_TOKEN_STORE: file
      AGENTGUARD_TOKEN_KEY: ${{ secrets.AGENTGUARD_TOKEN_KEY }}
      AGENTGUARD_LIVE_PROFILE: ${{ github.workspace }}/live-profile
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: cd lean && lake build guard-worker
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync --locked
      - name: Profile from the template, signed in with the stored token file
        run: |
          uv run agentguard init github --profile "$AGENTGUARD_LIVE_PROFILE" --no-login
          mkdir -p ~/.agentguard && echo "${{ secrets.AGENTGUARD_TOKEN_FILE }}" | base64 -d > ~/.agentguard/tokens.enc
      - run: uv run pytest tests/live -v
