# yaml-language-server: $schema=../schema/rules.schema.json
#
# The frontier-risk template: rules from the FLI AI Safety Index (Summer 2026)
# and AIR-Bench 2024 about what an agent may do. See docs/frontier-risk.md.
#
# How to use: copy the rules below to the TOP of your profile's `rules:` list.
# Lean proves (lean/Guard/Rulesets/FrontierRisk.lean) that whatever rules you
# put after them, a call caught by a deny rule here is denied, and a call caught
# by an ask rule here is never allowed without a person.
#
# Tool names are PLACEHOLDERS. Before relying on a rule, check that its pattern
# catches the real tool names of the MCP servers in your profile (and add
# patterns if it doesn't). Patterns match `server.tool`; `*` never matches `/`.
#
# Keep this list identical to `frontierTemplate` in the Lean file, in the same
# order: tests/unit/test_frontier_risk.py checks that.

labels: [public]

rules:
  # Never: offensive cyber actions (AIR-Bench 1.1-1.3)
  - { tool: "*.port_scan*", action: deny, note: "R075 AIR-Bench 1.1.1 Network intrusion" }
  - { tool: "*.vuln_scan*", action: deny, note: "R076 AIR-Bench 1.1.2 Vulnerability probing" }
  - { tool: "*.spoof_*", action: deny, note: "R077 AIR-Bench 1.1.3 Spoofing" }
  - { tool: "*.remote_login*", action: deny, note: "R080 AIR-Bench 1.1.6 Unauthorized network entry" }
  - { tool: "*.run_unsandboxed*", action: deny, note: "R081 AIR-Bench 1.2.7 Malware" }
  - { tool: "*.raw_packet*", action: deny, note: "R082 AIR-Bench 1.2.8 Packet forgery" }
  - { tool: "*.edit_audit_log*", action: deny, note: "R083 AIR-Bench 1.2.9 Data tampering" }
  - { tool: "*.push_files", when: { path: "agentguard/**" }, action: deny, note: "R084 AIR-Bench 1.2.10 Control override: never edit AgentGuard's own files. Also denies a push with no path at all." }
  - { tool: "*.flood_*", action: deny, note: "R085 AIR-Bench 1.3.11 System/Website impairment" }
  - { tool: "*.network_config*", action: deny, note: "R086 AIR-Bench 1.3.12 Network disruption" }

  # Never: autonomously operate critical systems (AIR-Bench 2.5)
  - { tool: "machinery.*", action: deny, note: "R097 AIR-Bench 2.5.11 Heavy machinery" }
  - { tool: "transport.*", action: deny, note: "R098 AIR-Bench 2.5.12 Transportation" }
  - { tool: "grid.*", action: deny, note: "R099 AIR-Bench 2.5.13 Energy/Electrical grids" }
  - { tool: "nuclear.*", action: deny, note: "R100 AIR-Bench 2.5.14 Nuclear facilities" }
  - { tool: "aviation.*", action: deny, note: "R101 AIR-Bench 2.5.15 Aircraft navigation/Air traffic control" }
  - { tool: "telecom.*", action: deny, note: "R102 AIR-Bench 2.5.16 Communication systems" }
  - { tool: "water.*", action: deny, note: "R103 AIR-Bench 2.5.17 Water treatment facilities" }
  - { tool: "lifesupport.*", action: deny, note: "R104 AIR-Bench 2.5.18 Life support" }
  - { tool: "weapons.*", action: deny, note: "R105 AIR-Bench 2.5.19 Weapon systems/Battlefield management" }
  - { tool: "emergency.*", action: deny, note: "R106 AIR-Bench 2.5.20 Emergency services" }

  # Only with a person: sending messages (AIR-Bench 1.1.4, 1.1.5).
  # An allow rule placed after the template can't let a send through: this rule
  # matches first (that is what the proofs guarantee). To allow-list recipients,
  # put an allow rule with a `when` on the recipient BEFORE this one, and accept
  # that the template's proof then no longer covers those sends.
  - { tool: "*.send_*", action: ask, note: "R078, R079 AIR-Bench 1.1.4 Spear phishing, 1.1.5 Social engineering" }

  # Only with a person: automated decisions about people (AIR-Bench 2.4).
  # A decision call with no `domain` argument also needs a person.
  - { tool: "*.decide_*", when: { domain: "financing*" }, action: ask, note: "R087 AIR-Bench 2.4.1 Financing eligibility/Creditworthiness" }
  - { tool: "*.decide_*", when: { domain: "criminal*" }, action: ask, note: "R088 AIR-Bench 2.4.2 Criminal justice/Predictive policing" }
  - { tool: "*.decide_*", when: { domain: "legal*" }, action: ask, note: "R089 AIR-Bench 2.4.3 Adversely affects legal rights" }
  - { tool: "*.decide_*", when: { domain: "employment*" }, action: ask, note: "R090 AIR-Bench 2.4.4 Employment" }
  - { tool: "*.decide_*", when: { domain: "social_scoring*" }, action: ask, note: "R091 AIR-Bench 2.4.5 Social scoring" }
  - { tool: "*.decide_*", when: { domain: "housing*" }, action: ask, note: "R092 AIR-Bench 2.4.6 Housing eligibility" }
  - { tool: "*.decide_*", when: { domain: "education*" }, action: ask, note: "R093 AIR-Bench 2.4.7 Education eligibility" }
  - { tool: "*.decide_*", when: { domain: "migration*" }, action: ask, note: "R094 AIR-Bench 2.4.8 Migration eligibility" }
  - { tool: "*.decide_*", when: { domain: "insurance*" }, action: ask, note: "R095 AIR-Bench 2.4.9 Insurance eligibility" }
  - { tool: "*.decide_*", when: { domain: "profiling*" }, action: ask, note: "R096 AIR-Bench 2.4.10 Profiling" }

  # Your own rules go here, after the template.
  # Anything no rule matches is denied (R107 AIR-Bench 2.5.21 needs no rule).
