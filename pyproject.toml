[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.0.1"
description = "An MCP gateway whose allow / ask / deny decisions are proved in Lean 4."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Beneficial AI Foundation" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Private :: Do Not Upload",
]
dependencies = [
    "keyring>=25",
    "mcp>=1.20",
    "pyyaml>=6",
]

[project.scripts]
agentguard = "agentguard.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
  "mypy>=1.13",
  "hypothesis>=6",
  "types-pyyaml>=6.0.12.20261113",
]

# `src/` itself is the `agentguard` package: there is no src/agentguard/ folder.
# setuptools maps the package name to the folder, for wheels and for editable
# installs (hatchling refuses editable installs with this kind of rename).
# Every Python subpackage must be listed here; tests/unit/test_package.py
# fails if one is missing.
[tool.setuptools]
package-dir = { "agentguard" = "src" }
packages = [
  "agentguard",
  "agentguard.auth",
  "agentguard.clients",
  "agentguard.console",
  "agentguard.monitor",
  "agentguard.profile",
  "agentguard.proxy",
]

[tool.setuptools.package-data]
agentguard = [
  "py.typed",
  "bin/*",
  "console/static/*",
  "templates/*/*.json",
  "templates/*/*.yaml",
  "templates/*/.env.example",
  "templates/*/demo/*.py",
  "templates/*/demo/stories/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
addopts = "-ra --strict-markers"
markers = ["live: talks to real GitHub (needs credentials; skipped by default)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
# Tests use seeded random data and start subprocesses on purpose.
"examples/**" = ["S101"]
"scripts/**" = ["S603", "S607", "S310"]
"tests/**" = ["S311", "S603", "S108", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["agentguard"]

# Static tools can't follow setuptools' editable import hook, so they see
# `agentguard` through the .typing/agentguard -> ../src symlink instead.
[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ".typing"

[tool.pyright]
extraPaths = [".typing"]
