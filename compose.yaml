# docker compose run --rm demo       six stories offline, against the mock GitHub server
# docker compose up gateway           the real gateway (profile in ~/.agentguard/github)
services:
  demo:
    build: .
    image: agentguard:dev
    command: ["demo"]
    profiles: ["demo"]

  gateway:
    build: .
    image: agentguard:dev
    environment:
      AGENTGUARD_GATEWAY_TOKEN: ${AGENTGUARD_GATEWAY_TOKEN:?set a token agents must send}
      AGENTGUARD_TOKEN_KEY: ${AGENTGUARD_TOKEN_KEY:?set a Fernet key for the token file}
      AGENTGUARD_MODE: ${AGENTGUARD_MODE:-enforce}
    volumes:
      - ${HOME}/.agentguard:/data
    ports:
      - "127.0.0.1:8080:8080"   # gateway, localhost only
      - "127.0.0.1:7070:7070"   # console, localhost only
