title: Normal day
summary: Fix the README typo. Branch, push, pull request, comment are all allowed, so AgentGuard doesn't get in the way.
theorem: null
steps:
  - call: get_file_contents
    args: { owner: octo-demo, repo: demo-public, path: README.md }
    expect: allow
  - call: create_branch
    args: { owner: octo-demo, repo: demo-public, branch: fix/typo }
    expect: allow
  - call: push_files
    args: { owner: octo-demo, repo: demo-public, branch: fix/typo, message: Fix typo,
            files: [{ path: README.md, content: "# Demo\n\nThe demo project for AgentGuard.\n" }] }
    expect: allow
  - call: create_pull_request
    args: { owner: octo-demo, repo: demo-public, title: Fix README typo, head: fix/typo, base: main }
    expect: allow
  - call: add_issue_comment
    args: { owner: octo-demo, repo: demo-public, issue_number: 1, body: "Fixed in #10." }
    expect: allow
checks:
  - { check: main_unchanged, args: [demo-public], says: main is unchanged }
  - { check: pr_open, args: [demo-public, 10], says: "PR #10 is open for review" }
